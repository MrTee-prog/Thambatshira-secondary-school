<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#192e5b">
  <title>Staff Login | Thambatshira Secondary School</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef1f6;
      color: #20283a;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      background: white;
      border-radius: 16px;
      border-top: 7px solid #d5b348;
      box-shadow: 0 8px 30px #00000015;
    }

    h1 {
      color: #192e5b;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #aeb7c7;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #192e5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #192e5b;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <h1>THAMBATSHIRA</h1>
    <p class="subtitle">School Staff Administration Portal</p>

    <form id="loginForm">
      <label for="email">Official staff email</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Sign In
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="index.html">
      ← Back to school website
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>

</body>
</html>
